<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Notes App</title>

    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./favicon.svg" />
    <link rel="stylesheet" href="./css/style.css" />

    <!-- Font Awesome Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>

  <body>
    <div class="app">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <div class="brand" aria-label="Notes app brand">
            <span class="brand-mark">N</span>
            <h1>Notes</h1>
          </div>
        </div>

        <button
          class="new-note-btn primary-btn"
          id="newNoteBtn"
          aria-label="Create new note"
        >
          <i class="fa-solid fa-plus"></i>
          <span>New Note</span>
        </button>

        <nav class="navigation" aria-label="Sidebar navigation">
          <button
            class="nav-item active"
            id="allNotesBtn"
            aria-label="All notes"
          >
            <i class="fa-solid fa-note-sticky"></i>
            <span>All Notes</span>
          </button>

          <button
            class="nav-item"
            id="notesListBtn"
            aria-label="Notes list view"
          >
            <i class="fa-solid fa-list"></i>
            <span>Notes List</span>
          </button>

          <button class="nav-item" id="favoritesBtn" aria-label="Favorites">
            <i class="fa-regular fa-star"></i>
            <span>Favorites</span>
          </button>

          <button class="nav-item" id="trashBtn" aria-label="Trash">
            <i class="fa-regular fa-trash-can"></i>
            <span>Trash</span>
          </button>
        </nav>

        <div class="sidebar-bottom">
          <div class="dark-mode">
            <div class="dark-mode-label">
              <i class="fa-solid fa-moon"></i>
              <span>Dark Mode</span>
            </div>

            <label class="switch" aria-label="Toggle dark mode">
              <input type="checkbox" id="themeToggle" />
              <span class="slider"></span>
            </label>
          </div>

          <button class="settings-btn" id="settingsBtn" aria-label="Settings">
            <i class="fa-solid fa-gear"></i>
            <span>Settings</span>
          </button>

          <a
            href="/login.html"
            class="settings-btn"
            id="authBtn"
            aria-label="Login or account"
          >
            <i class="fa-solid fa-right-to-bracket"></i>
            <span id="authBtnText">Login</span>
          </a>

          <div class="user-profile">
            <div class="avatar">U</div>

            <div class="user-info">
              <h4>User</h4>
              <p>user@example.com</p>
            </div>
          </div>
        </div>
      </aside>

      <section
        class="notes-list notes-panel"
        id="notesPanel"
        aria-label="Notes list panel"
      >
        <div class="notes-header">
          <button
            class="icon-btn mobile-only"
            id="notesListCloseBtn"
            aria-label="Close notes list"
          >
            <i class="fa-solid fa-arrow-left"></i>
          </button>

          <h2>All notes</h2>

          <div class="notes-header-actions">
            <button class="icon-btn" id="searchBtn" aria-label="Search notes">
              <i class="fa-solid fa-magnifying-glass"></i>
            </button>

            <button
              class="icon-btn"
              id="notesMoreBtn"
              aria-label="More actions"
            >
              <i class="fa-solid fa-ellipsis-vertical"></i>
            </button>
          </div>
        </div>

        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>

          <input
            type="text"
            id="searchInput"
            placeholder="Search notes..."
            autocomplete="off"
          />
        </div>

        <div class="notes-container" id="notesContainer"></div>

        <button class="fab" id="newNoteFab" aria-label="Create new note">
          <i class="fa-solid fa-plus"></i>
        </button>
      </section>

      <main class="editor" aria-label="Note editor">
        <header class="editor-header">
          <button
            class="icon-btn back-btn mobile-only"
            id="editorBackBtn"
            aria-label="Back to notes list"
          >
            <i class="fa-solid fa-arrow-left"></i>
          </button>

          <div class="editor-headline">
            <span id="saveStatus">No note selected</span>
          </div>

          <div class="editor-actions">
            <button
              type="button"
              id="saveBtn"
              class="primary-btn small-btn"
              title="Save note"
            >
              Save
            </button>

            <button type="button" id="attachmentBtn" title="Attach file">
              <i class="fa-solid fa-paperclip"></i>
            </button>

            <button
              type="button"
              id="favoriteBtn"
              title="Favorite note"
              aria-label="Favorite note"
            >
              <i class="fa-regular fa-star"></i>
            </button>

            <button
              type="button"
              id="deleteBtn"
              title="Delete note"
              aria-label="Delete note"
            >
              <i class="fa-regular fa-trash-can"></i>
            </button>

            <button
              type="button"
              id="moreBtn"
              title="More options"
              aria-label="More options"
            >
              <i class="fa-solid fa-ellipsis-vertical"></i>
            </button>
          </div>
        </header>

        <div class="editor-surface">
          <input
            type="text"
            class="note-title"
            id="noteTitle"
            placeholder="Untitled Note"
            autocomplete="off"
            disabled
          />

          <div class="toolbar" aria-label="Formatting tools">
            <button type="button" id="boldBtn" title="Bold"><b>B</b></button>
            <button type="button" id="italicBtn" title="Italic">
              <i>I</i>
            </button>
            <button type="button" id="underlineBtn" title="Underline">
              <u>U</u>
            </button>

            <div class="divider"></div>

            <button type="button" id="taskListBtn" title="Task list">
              <i class="fa-regular fa-square-check"></i>
            </button>
            <button type="button" id="bulletListBtn" title="Bullet list">
              <i class="fa-solid fa-list-ul"></i>
            </button>
            <button type="button" id="numberListBtn" title="Numbered list">
              <i class="fa-solid fa-list-ol"></i>
            </button>

            <div class="divider"></div>

            <button type="button" id="alignLeftBtn" title="Align left">
              <i class="fa-solid fa-align-left"></i>
            </button>
            <button type="button" id="alignCenterBtn" title="Align center">
              <i class="fa-solid fa-align-center"></i>
            </button>
            <button type="button" id="alignRightBtn" title="Align right">
              <i class="fa-solid fa-align-right"></i>
            </button>

            <div class="divider"></div>

            <button type="button" id="undoBtn" title="Undo">
              <i class="fa-solid fa-arrow-rotate-left"></i>
            </button>
            <button type="button" id="redoBtn" title="Redo">
              <i class="fa-solid fa-arrow-rotate-right"></i>
            </button>
          </div>

          <div
            class="editor-content"
            id="noteContent"
            contenteditable="false"
            data-placeholder="Start writing your note..."
            aria-label="Note content"
          ></div>
        </div>
      </main>
    </div>

    <div class="auth-modal hidden" id="authModal">
      <div class="auth-card">
        <button class="auth-close" id="authClose">&times;</button>
        <h3 id="authTitle">Login</h3>

        <form id="authForm">
          <div class="form-group">
            <label for="authEmail">Email</label>
            <input type="email" id="authEmail" required />
          </div>

          <div class="form-group">
            <label for="authPassword">Password</label>
            <input type="password" id="authPassword" required />
          </div>

          <div class="form-actions">
            <button type="submit" id="authSubmit">Login</button>
            <button type="button" id="switchAuth">Switch to Register</button>
          </div>

          <div class="auth-error" id="authError" aria-live="polite"></div>
        </form>
      </div>
    </div>

    <script src="./js/app.js"></script>
    <script src="./js/auth.js"></script>
  </body>
</html>
